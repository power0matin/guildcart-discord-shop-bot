name: Feature request
description: Propose a focused improvement to GuildCart.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need, not just the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected user experience and edge cases.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shop and product catalogue
        - Orders and payments
        - Product delivery / VPN provider
        - Subscription lifecycle
        - Tickets and moderation
        - Security and permissions
        - Deployment and documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or trade-offs
      description: Any simpler options or relevant constraints?
    validations:
      required: false
