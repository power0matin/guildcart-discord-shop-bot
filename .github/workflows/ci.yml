name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    name: Install, unit tests, extension registration, and syntax check (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare safe sample configuration
        run: cp config.json.example config.json

      - name: Verify runtime imports
        run: python -c "import discord; import dotenv; print('discord.py', discord.__version__)"

      - name: Run unit and extension tests
        run: python -m unittest discover -s tests -v

      - name: Compile application modules
        run: python -m compileall -q bot.py config.py features tests
